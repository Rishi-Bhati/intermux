name: Build and Test InterMux Windows

on:
  push:
    branches: [main, feat/windows-2.2.1]
    paths:
      - "windows/**"
      - "intermux/**"
      - "scripts/fetch-wintun.ps1"
      - "tests/**"
      - ".github/workflows/build_windows.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build & Test InterMux on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: windows/engine/go.sum

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt

      - name: Fetch and verify Wintun 0.14.1 DLL
        shell: pwsh
        run: |
          ./scripts/fetch-wintun.ps1 -Arch amd64 -OutDir windows/engine

      - name: Run Go engine tests (Windows)
        working-directory: windows/engine
        run: |
          go test -v ./...

      - name: Build intermux-net.exe
        working-directory: windows/engine
        run: |
          go build -trimpath -ldflags="-s -w" -o intermux-net.exe ./cmd/intermux-net

      - name: Install engine to admin-only Program Files directory
        shell: pwsh
        run: |
          $pfDir = Join-Path $env:ProgramFiles "InterMux"
          New-Item -ItemType Directory -Force -Path $pfDir | Out-Null
          Copy-Item -LiteralPath "windows\engine\intermux-net.exe" -Destination (Join-Path $pfDir "intermux-net.exe") -Force
          Copy-Item -LiteralPath "windows\engine\wintun.dll" -Destination (Join-Path $pfDir "wintun.dll") -Force
          & (Join-Path $pfDir "intermux-net.exe") check

      - name: Byte-compile Python sources and tests
        run: |
          python -m compileall -q intermux tests

      - name: Run Windows Python unit tests
        run: |
          python -m unittest tests.test_platform_base tests.test_windows_backend -v

      - name: Run Windows E2E & security test suite (strict mode)
        env:
          INTERMUX_E2E_STRICT: "1"
        run: |
          python -m unittest discover -s tests/e2e_win -t . -v

      - name: Build unprivileged InterMux.exe with PyInstaller
        run: |
          pyinstaller windows/intermux_windows.spec

      - name: Smoke test built executables
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\InterMux.exe")) { throw "Missing dist\InterMux.exe" }
          if (-not (Test-Path "windows\engine\intermux-net.exe")) { throw "Missing intermux-net.exe" }
          & ".\windows\engine\intermux-net.exe" version
          & ".\windows\engine\intermux-net.exe" interfaces --all | Out-Null

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InterMux-Windows-v2.2.1
          path: |
            dist/InterMux.exe
            windows/engine/intermux-net.exe
            windows/engine/wintun.dll
          retention-days: 14
          if-no-files-found: error
