name: Build InterMux Windows .exe

# Triggers:
#   - Every push to main that touches windows/ code
#   - Every release published (attaches the .exe to the release)
#   - Manual run from the Actions tab
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/build_windows.yml"
  release:
    types: [published]
  workflow_dispatch:   # manual trigger

jobs:
  build-windows-exe:
    name: Build InterMux.exe on Windows
    runs-on: windows-latest   # ← real Windows VM — produces genuine .exe

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python (matches our minimum requirement)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pyinstaller
        working-directory: windows

      # 4. Build the executable using our spec file
      - name: Build InterMux.exe with PyInstaller
        run: |
          pyinstaller windows/intermux_windows.spec
        working-directory: ${{ github.workspace }}

      # 5. Rename for clarity and verify
      - name: Verify output
        run: |
          dir dist\
          echo "Build complete: dist\InterMux.exe"
        shell: cmd

      # 6. Upload as a workflow artifact (downloadable from the Actions tab)
      - name: Upload InterMux.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterMux-Windows-exe
          path: dist/InterMux.exe
          retention-days: 30
          if-no-files-found: error

      # 7. On tagged releases: attach the .exe directly to the GitHub Release
      - name: Attach .exe to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InterMux.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
