[workspace]
members = ["intermux-common", "intermuxd"]
resolver = "2"

[workspace.package]
version = "3.0.0-beta.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "io-util", "macros", "process", "sync", "fs"] }
log = "0.4"

